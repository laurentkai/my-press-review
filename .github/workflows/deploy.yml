name: Verify and deploy

on:
  push:
    branches: [Main]
  pull_request:
    branches: [Main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize production promotions, migrations and deployments. Never interrupt
# an invocation that might already have started a database migration.
concurrency:
  group: press-review-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run db:migrate:local

  deploy:
    if: github.ref == 'refs/heads/Main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
    steps:
      - name: Check deployment configuration
        id: configuration
        env:
          DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$DEPLOY_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_D1_DATABASE_ID" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare deployment is not configured. Add CLOUDFLARE_API_TOKEN (secret), CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_D1_DATABASE_ID (variables)."
            echo "### Deployment not configured" >> "$GITHUB_STEP_SUMMARY"
            echo "Checks passed. No Production promotion or Cloudflare deployment was performed. Configure the required secret and variables, then rerun this workflow on Main." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.configuration.outputs.ready == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.configuration.outputs.ready == 'true'
        with:
          node-version: "24"
          cache: npm
      - name: Build deployment-only release
        if: steps.configuration.outputs.ready == 'true'
        run: |
          npm ci
          npm run build
          npm run release:export
          npx wrangler deploy --config .release/wrangler.json --dry-run
      - name: Promote release to Production
        if: steps.configuration.outputs.ready == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm run release:promote
      - name: Apply migrations and deploy Production release
        if: steps.configuration.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 migrations apply press-review --remote --config .release/wrangler.json
          npx wrangler deploy --config .release/wrangler.json
          echo "### Deployed release $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Production contains the deployment-only snapshot. See Wrangler output for the Worker URL." >> "$GITHUB_STEP_SUMMARY"
