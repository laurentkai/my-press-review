name: Verify and deploy

on:
  push:
    branches: [Main]
  pull_request:
    branches: [Main]
  workflow_dispatch:

permissions:
  contents: read

# Only Main joins production serialization. Never interrupt a running migration.
concurrency:
  group: press-review-${{ github.ref == 'refs/heads/Main' && 'production' || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/Main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run db:migrate:local
      - name: Save the verified build
        if: github.ref == 'refs/heads/Main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-build-${{ github.run_id }}
          retention-days: 1
          overwrite: true
          include-hidden-files: true
          path: |
            dist/client/
            dist/my_press_review/index.js
            dist/my_press_review/wrangler.json

  deploy:
    if: github.ref == 'refs/heads/Main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
    outputs:
      deployed: ${{ steps.publish.outputs.deployed }}
    steps:
      - name: Check deployment configuration
        id: configuration
        env:
          DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$DEPLOY_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_D1_DATABASE_ID" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare deployment is not configured. Add CLOUDFLARE_API_TOKEN (secret), CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_D1_DATABASE_ID (variables)."
            echo "### Deployment not configured" >> "$GITHUB_STEP_SUMMARY"
            echo "Checks passed. No Production promotion or Cloudflare deployment was performed. Configure the required secret and variables, then rerun the workflow on current Main." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.configuration.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.configuration.outputs.ready == 'true'
        with:
          node-version: "24"
          cache: npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.configuration.outputs.ready == 'true'
        with:
          name: verified-build-${{ github.run_id }}
          path: dist
      - name: Prepare the verified release
        if: steps.configuration.outputs.ready == 'true'
        run: |
          npm ci --ignore-scripts
          node scripts/assert-current-main.mjs
          npm run release:export
          npm run release:configure
          npx --no-install wrangler deploy --config .deployment/wrangler.json --dry-run
      - name: Record recovery point, migrate and deploy
        id: publish
        if: steps.configuration.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/assert-current-main.mjs
          npx --no-install wrangler d1 time-travel info press-review --config .deployment/wrangler.json --json > "$RUNNER_TEMP/d1-before.json"
          npx --no-install wrangler d1 migrations apply press-review --remote --config .deployment/wrangler.json
          npx --no-install wrangler deploy --config .deployment/wrangler.json
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          echo "### Deployed release $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "See Wrangler output for the Worker URL. Production promotion follows in a separate job." >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve D1 recovery bookmark
        if: always() && steps.configuration.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: d1-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/d1-before.json
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
      - name: Pass the deployed snapshot to promotion
        if: steps.publish.outputs.deployed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployed-release-${{ github.run_id }}
          path: .release/
          include-hidden-files: true
          retention-days: 1
          overwrite: true

  promote:
    needs: deploy
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: deployed-release-${{ github.run_id }}
          path: .release
      - name: Promote the successfully deployed snapshot
        env:
          RELEASE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/promote-release.mjs
          echo "### Production updated to deployed release $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
